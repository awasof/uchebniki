<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учебники Вероники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='24' height='44' rx='4' fill='%23BE4527'/%3E%3Crect x='34' y='10' width='24' height='44' rx='4' fill='%232D7A55'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F1EADC; --card:#FFFBF2; --ink:#221F1A; --soft:#5F5648; --line:#D9CDB7;
  --track:#E8DFCC; --shadow:0 1px 0 rgba(60,45,20,.06),0 10px 28px -14px rgba(60,45,20,.35);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#1B1915; --card:#25221D; --ink:#F2EBDD; --soft:#B9AE9B; --line:#3A352D;
         --track:#3A352D; --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.8); }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font:400 17px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.wrap{padding:56px 16px 32px}
.tag{display:inline-block;font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--soft);
  border:1.5px solid var(--line);border-radius:999px;padding:5px 12px}
h1{font-weight:800;font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-.02em;margin:16px 0 8px}
.lede{color:var(--soft);font-size:18px;margin:0;max-width:34em}
main{padding-bottom:64px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{--c:#888;position:relative;display:flex;flex-direction:column;gap:18px;
  background:var(--card);border-radius:22px;padding:26px 24px 22px;box-shadow:var(--shadow);
  color:inherit;text-decoration:none;border:1.5px solid transparent;overflow:hidden;
  transition:transform .15s ease,border-color .15s ease}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:var(--c)}
a.card:hover{transform:translateY(-3px);border-color:var(--c)}
a.card:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.ico{width:76px;height:76px;border-radius:20px;background:var(--c);display:grid;place-items:center;flex:none}
.ico svg{width:46px;height:46px}
.body{display:flex;flex-direction:column;gap:6px;flex:1}
.t{font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.01em}
.b{color:var(--soft);font-size:15px}
.prog{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:999px;transition:width .6s ease}
.pt{font-weight:600;font-size:16px}
.pt small{font-weight:400;color:var(--soft);font-size:14px;margin-left:6px}
.go{align-self:flex-start;font-weight:700;font-size:17px;color:#fff;background:var(--c);
  border-radius:12px;padding:11px 18px}
.card.soon{opacity:.62}
.card.soon .go{background:var(--track);color:var(--soft)}
@media (max-width: 899px){
  header.wrap{padding:36px 16px 24px}
  .grid{grid-template-columns:1fr;gap:16px}
  .card{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:20px;row-gap:14px;padding:24px 20px 20px}
  .card .body{grid-column:2}
  .card .prog,.card .go{grid-column:1 / -1}
  .card .go{justify-self:start}
}
@media (max-width: 420px){
  .ico{width:60px;height:60px;border-radius:16px}.ico svg{width:36px;height:36px}
  .t{font-size:25px}
}
@media (prefers-reduced-motion: reduce){.card,.bar i{transition:none}}
</style>
</head>
<body>
<header class="wrap">
  <span class="tag">5 класс · 2026–2027</span>
  <h1>Учебники Вероники</h1>
  <p class="lede">Выбирай предмет, а в нём — параграф, который задали.</p>
</header>
<main class="wrap">
  <div class="grid" id="grid"></div>
</main>
<script>
const SUBJECTS = [{"id": "history", "title": "История", "book": "История Древнего мира · Мединский, Чубарьян", "color": "#BE4527", "icon": "column"}, {"id": "biology", "title": "Биология", "book": "«Линия жизни» · Пасечник", "color": "#2D7A55", "icon": "leaf"}, {"id": "geography", "title": "География", "book": "5–6 класс · «Полярная звезда»", "color": "#2F6F8F", "icon": "globe"}];
const ICONS = {
  column: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 11h32M10 7h28v4H10zM12 15h24M14 15v24M20 15v24M28 15v24M34 15v24M11 39h26M8 43h32"/></svg>',
  leaf: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M40 8C22 8 9 17 9 31c0 4 1 7 3 9 14 0 28-11 28-32z"/><path d="M8 42l26-26M17 33h9M22 26l1-8M27 22h8"/></svg>',
  globe: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="17"/><ellipse cx="24" cy="24" rx="7.5" ry="17"/><path d="M7 24h34M10 15h28M10 33h28"/></svg>'
};

function card(s){
  const el = document.createElement('div');
  el.className = 'card soon';
  el.style.setProperty('--c', s.color);
  el.innerHTML =
    '<div class="ico">' + (ICONS[s.icon] || '') + '</div>' +
    '<div class="body"><div class="t"></div><div class="b"></div></div>' +
    '<div class="prog"><div class="bar"><i></i></div><div class="pt">загружаю…</div></div>' +
    '<span class="go">скоро</span>';
  el.querySelector('.t').textContent = s.title;
  el.querySelector('.b').textContent = s.book;
  return el;
}

function ready(el, s, m){
  const a = document.createElement('a');
  a.className = 'card';
  a.href = s.id + '/index.html';
  a.style.cssText = el.style.cssText;
  a.innerHTML = el.innerHTML;
  const n = Array.isArray(m.ready) ? m.ready.length : 0;
  const total = m.total || n;
  const pt = a.querySelector('.pt');
  pt.textContent = 'Разобрано ' + n + ' из ' + total;
  if (m.updated) {
    const d = new Date(m.updated + 'T12:00:00');
    if (!isNaN(d)) {
      const sm = document.createElement('small');
      sm.textContent = '· обновлено ' + d.toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'});
      pt.appendChild(sm);
    }
  }
  a.querySelector('.go').textContent = 'Открыть →';
  a.setAttribute('aria-label', s.title + ': разобрано ' + n + ' из ' + total);
  el.replaceWith(a);
  requestAnimationFrame(() => { a.querySelector('.bar i').style.width = (total ? Math.round(100 * n / total) : 0) + '%'; });
}

const grid = document.getElementById('grid');
SUBJECTS.forEach(s => {
  const el = card(s);
  grid.appendChild(el);
  fetch(s.id + '/manifest.json', {cache: 'no-cache'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(m => ready(el, s, m))
    .catch(() => { el.querySelector('.pt').textContent = 'Скоро появится'; });
});
</script>
</body>
</html>
